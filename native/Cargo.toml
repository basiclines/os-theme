[package]
name = "os-theme"
version = "0.1.0"
edition = "2021"
description = "Native OS theme detection library"
license = "MIT"

[lib]
crate-type = ["cdylib"]

# macOS: uses raw FFI to CoreFoundation + AppKit (linked via build.rs)

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Registry", "Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"
