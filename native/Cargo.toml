[package]
name = "os-theme"
version = "0.1.0"
edition = "2021"
description = "Native OS theme detection library"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSDistributedNotificationCenter", "NSString", "NSRunLoop", "NSDate"] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Registry", "Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"
