[package]
name = "os-theme-napi"
version = "0.1.0"
edition = "2021"
description = "N-API bindings for os-theme"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi4"] }
napi-derive = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Registry", "Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"

[build-dependencies]
napi-build = "2"
