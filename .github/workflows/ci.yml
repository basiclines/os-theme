name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
            platform: darwin
          - os: macos-13
            target: x86_64-apple-darwin
            arch: x64
            platform: darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x64
            platform: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
            platform: win32

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: bun install

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      # ── Build native library (Bun FFI) ──
      - name: Build native library
        working-directory: native
        run: cargo build --release --target ${{ matrix.target }}

      # ── Build N-API addon (Node.js) ──
      - name: Build N-API addon
        working-directory: napi
        run: cargo build --release --target ${{ matrix.target }}

      # ── Copy artifacts to expected locations ──
      - name: Prepare artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          LIB_EXT=$([[ "${{ matrix.platform }}" == "darwin" ]] && echo "dylib" || echo "so")
          mkdir -p native/target/release
          cp native/target/${{ matrix.target }}/release/libos_theme.$LIB_EXT native/target/release/
          cp napi/target/${{ matrix.target }}/release/libos_theme_napi.$LIB_EXT \
             native/target/release/os-theme-napi.${{ matrix.platform }}-${{ matrix.arch }}.node

      - name: Prepare artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path native/target/release
          Copy-Item native/target/${{ matrix.target }}/release/os_theme.dll native/target/release/
          Copy-Item napi/target/${{ matrix.target }}/release/os_theme_napi.dll `
            native/target/release/os-theme-napi.${{ matrix.platform }}-${{ matrix.arch }}.node

      # ── Build helper binary (macOS only) ──
      - name: Build macOS helper
        if: matrix.platform == 'darwin'
        run: |
          ls native/target/release/os-theme-helper 2>/dev/null && echo "Helper already built by build.rs" || echo "Helper not found"

      # ── Run tests (macOS only — integration test needs GUI) ──
      - name: Run tests (macOS)
        if: matrix.platform == 'darwin'
        run: bun test test/current.test.ts test/listener.test.ts test/dispose.test.ts

      # ── Verify Node.js addon loads ──
      - name: Verify Node.js addon
        if: runner.os != 'Windows'
        run: |
          node -e "
            const addon = require('./native/target/release/os-theme-napi.${{ matrix.platform }}-${{ matrix.arch }}.node');
            console.log('N-API functions:', Object.keys(addon));
            const mode = addon.getAppearance();
            console.log('Current theme:', mode === 1 ? 'dark' : 'light');
          "

      - name: Verify Node.js addon (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node -e "
            const addon = require('./native/target/release/os-theme-napi.${{ matrix.platform }}-${{ matrix.arch }}.node');
            console.log('N-API functions:', Object.keys(addon));
            const mode = addon.getAppearance();
            console.log('Current theme:', mode === 1 ? 'dark' : 'light');
          "

      # ── Upload build artifacts ──
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: os-theme-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            native/target/release/os-theme-napi.${{ matrix.platform }}-${{ matrix.arch }}.node
            native/target/release/os-theme-helper
          if-no-files-found: warn
